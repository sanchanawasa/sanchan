<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>All 888 — ZEC NINJA 888</title><meta name="theme-color" content="#08080b">
<style>
:root{--bg:#08080b;--panel:#111117;--line:#2c2931;--gold:#efbf4f;--muted:#98959e}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 80% 0,#261b09 0,transparent 26%),var(--bg);color:#f8f3e8;font-family:Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:20;background:#08080be8;backdrop-filter:blur(15px);border-bottom:1px solid #29272e;padding:16px 5vw;display:flex;justify-content:space-between;align-items:center}
a{color:inherit;text-decoration:none}.brand{font-weight:950;letter-spacing:.1em}.brand b{color:var(--gold)}main{width:min(1400px,92vw);margin:auto;padding:55px 0 90px}
h1{font-size:clamp(42px,7vw,80px);margin:0 0 8px;letter-spacing:-.05em}.sub{color:var(--muted);line-height:1.6}.counts{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}
.pill,.filter button{border:1px solid var(--line);background:#101016;color:#ddd;border-radius:999px;padding:9px 13px;font-weight:800}.pill strong{color:var(--gold)}
.controls{display:grid;grid-template-columns:1fr auto;gap:12px;margin:28px 0}.search{width:100%;background:#101016;border:1px solid var(--line);border-radius:12px;color:white;padding:14px 16px;font-size:16px}
.filter{display:flex;gap:8px;flex-wrap:wrap}.filter button{cursor:pointer}.filter button.active{background:var(--gold);color:#111;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.card.legendary{border-color:#efbf4f;box-shadow:0 0 18px #efbf4f25}
.art{aspect-ratio:1;background:#0c0c11;display:grid;place-items:center;overflow:hidden}.art img{width:100%;height:100%;object-fit:cover}.placeholder{padding:16px;text-align:center;color:#6f6c74;font-size:12px}.meta{padding:12px}.meta b{display:block}.meta span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.legendary .meta span{color:#ffd76b}
.notice{border:1px solid #4a3a1d;background:#161207;border-radius:12px;padding:13px 15px;color:#d9c18b;margin-bottom:22px;font-size:13px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:650px){.controls{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><a class="brand" href="/"><b>ZEC</b> NINJA 888</a><a href="/">← HOME</a></header>
<main><h1>ALL 888</h1><div class="sub">Search and filter the entire clan. Legendary = 18 rainbow-outfit ninjas.</div>
<div class="counts"><span class="pill"><strong>600</strong> Common</span><span class="pill"><strong>200</strong> Rare</span><span class="pill"><strong>70</strong> Epic</span><span class="pill"><strong>18</strong> Legendary</span></div>
<div id="notice" class="notice">PRE-DEPLOY · Individual immutable artwork will switch to IPFS automatically when the image CID is published.</div>
<div class="controls"><input id="q" class="search" placeholder="Search #001 – #888"><div class="filter" id="filters"></div></div><div id="grid" class="grid"></div></main>
<script>
let cfg={image_root_cid:"TBD"};let active="All";
const rarity=i=>i<600?"Common":i<800?"Rare":i<870?"Epic":"Legendary";
const filters=["All","Common","Rare","Epic","Legendary"];
const f=document.getElementById("filters"),g=document.getElementById("grid"),q=document.getElementById("q");
filters.forEach(x=>{let b=document.createElement("button");b.textContent=x;b.onclick=()=>{active=x;[...f.children].forEach(v=>v.classList.toggle("active",v===b));render()};if(x==="All")b.className="active";f.appendChild(b)});
function render(){let s=q.value.replace(/[^0-9]/g,"");let html="";for(let i=0;i<888;i++){let r=rarity(i),n=String(i+1).padStart(3,"0");if(active!=="All"&&r!==active)continue;if(s&&!n.includes(s))continue;let cid=cfg.image_root_cid||"";let live=cid&&!cid.startsWith("TBD")&&!cid.startsWith("REPLACE");let art=live?`<img loading="lazy" src="https://ipfs.io/ipfs/${cid}/${i}.jpg" alt="ZEC NINJA #${n}">`:`<div class="placeholder">#${n}<br>ART PUBLISHING</div>`;html+=`<article class="card ${r.toLowerCase()}"><div class="art">${art}</div><div class="meta"><b>ZEC NINJA #${n}</b><span>${r}</span></div></article>`}g.innerHTML=html}
q.oninput=render;fetch("/zec-ninja-chain.json",{cache:"no-store"}).then(r=>r.json()).then(x=>{cfg=x;render()}).catch(render);render();
</script></body></html>
